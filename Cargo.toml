[workspace]
resolver = "2"
members = [
    "crates/app-core",
    "crates/inference",
    "crates/benchmark",
    "crates/documents",
    "crates/storage",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal crates
app-core = { path = "crates/app-core" }
inference = { path = "crates/inference" }
benchmark = { path = "crates/benchmark" }
documents = { path = "crates/documents" }
storage = { path = "crates/storage" }

# Shared third-party
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "macros"] }
tracing = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "serde_json"] }
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "time", "io-util", "sync"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
async-trait = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
