name: CI

on:
  push:
    branches: [main]
  pull_request:

# Build-time provisioning is explicit; the desktop app itself has no downloader.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter @offline-ai/desktop typecheck
      - run: pnpm --filter @offline-ai/desktop test
      - run: pnpm --filter @offline-ai/desktop build:vite
      - run: pnpm --filter @offline-ai/desktop exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: node scripts/setup-runtime.mjs --fixtures
      - run: node scripts/verify-native.mjs

  type-drift:
    name: Bindings drift check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: node scripts/generate-bindings.mjs --check

  build:
    name: Tauri build (macOS Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/setup-runtime.mjs
      - run: pnpm tauri build --bundles app
      - uses: actions/upload-artifact@v4
        with:
          name: offline-ai-assistant-macos-arm64
          path: target/release/bundle/macos/*.app
          retention-days: 7
